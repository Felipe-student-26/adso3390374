<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-box-shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section .box {
            border: 2px solid #fff;
            height: 160px;
            margin: 2rem auto;
            width: 280px;
        }

        section .box1 {
            box-shadow: 0 0 12px #fff;
        }

        section .box2 {
            box-shadow: -10px -10px 24px 0 #fff;
        }

        section .box3 {
            box-shadow: 0 0 20px #fff inset;
        }

        section .box4 {
            box-shadow: 0 0 0 6px #ffcd00,
                        12px 12px 0 6px #003087,
                        24px 24px 0 6px #c8102e;
        }

        section .images {
            text-align: center;
        }

        section .images img {
            width: 150px;
        }

        section .images img:first-child {
            box-shadow: 0 0 18px #fff;
        }

        section .images img:last-child {
            filter: drop-shadow(0 0 6px red);
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
        <main>
            <header class="mainmenu ">
            <h1>27-box-shadow</h1>
            <h4>Property attaches one or more shadows to an element.</h4>
            </header>
         
      <section>
            <section>
                <h4>box-shadow: 0 0 12px #fff</h4>
                <div class="box box1"></div>
                <h4>box-shadow: -10px -10px 24px 0 #fff</h4>
                <div class="box box2"></div>
                <h4>box-shadow: 0 0 20px #fff inset</h4>
                <div class="box box3"></div>
                <h4>box-shadow: multiple</h4>
                <div class="box box4"></div>
                <h4>box-shadow VS drop-shadow()</h4>
                <div class="images">
                    <img src="../src/imgs/mario.png" alt="Mario con box-shadow">
                    <img src="../src/imgs/mario.png" alt="Mario con drop-shadow">
                </div>
            </section>
      </section>
      
    </main>
