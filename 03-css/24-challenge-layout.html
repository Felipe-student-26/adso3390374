<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>24-Challenge Layout</title>
	<link rel="stylesheet" href="../src/css/master.css">
	<style>
		.layout {
			background: transparent;
			border-radius: 0;
			display: grid;
			gap: 1rem;
			grid-template-columns: 1fr 1fr;
			margin: 0;
			overflow: visible;
			padding: 0;
		}
		.layout article {
			background-color: #fff;
			border-radius: 0.4rem;
			color: #222;
			min-height: 120px;
			padding: 1rem;
		}
		.layout article:first-child {
			background: #ffcf33;
			grid-column: 1 / -1;
		}
		.layout article:last-child {
			background: #48d597;
			grid-column: 1 / -1;
		}
		.layout h2 {
			background: transparent;
			color: #222;
			margin: 0 0 0.5rem;
			padding: 0;
			position: static;
		}
		.layout p { margin: 0; }
		@media (max-width: 420px) {
			.layout { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body class="css">
	<a href="index.html" class="btn-home">
		<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
	</a>
	<main>
		<header class="mainmenu">
			<h1>24-Challenge Layout</h1>
			<h3>Build a responsive layout with CSS Grid.</h3>
		</header>
		<section>
			<section class="layout">
				<article>
					<h2>Header</h2>
					<p>A full-width grid item.</p>
				</article>
				<article>
					<h2>Content</h2>
					<p>Two columns share the available space.</p>
				</article>
				<article>
					<h2>Aside</h2>
					<p>The layout remains readable on small screens.</p>
				</article>
				<article>
					<h2>Footer</h2>
					<p>Another full-width grid item.</p>
				</article>
			</section>
		</section>
	</main>
</body>
</html>
