<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section .filter {
            background: url(imgs/cyndaquil2.png) center / contain no-repeat;
            border: 2px solid #fff;
            height: 220px;
            margin: 1rem auto 2rem;
            width: 100%;
        }

        section .sepia {
            filter: sepia(100%);
        }

        section .grayscale {
            filter: grayscale(100%);
        }

        section .negative {
            filter: invert(100%);
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">

    </a>
    <main>
        <header class="mainmenu">
            <h1>31-filters</h1>
            <h4>Property (filter) applies graphical transformations (e.g., blur(), grayscale(), contrast(), drop-shadow()) to elements before display.</h4>
        </header>

        <section>
            <section>
                <h4>Original</h4>
                <div class="filter"></div>
                <h4>filter: sepia(100%)</h4>
                <div class="filter sepia"></div>
                <h4>filter: grayscale(100%)</h4>

                <h4>filter: invert(100%)</h4>
                <div class="filter negative"></div>
            </section>
        </section>
    </main>
