<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section .filter {
            width: 220px;
            max-width: 100%;
            display: block;
            margin: 1rem auto;
            outline: 2px solid white;
            border-radius: 14px;
            corner-shape: squircle;
            background: linear-gradient(45deg,red 50%,blue 50%);
            transition: all 0.2s ease-in;

            &.sepia {
                filter: sepia(1);
            }

            &.grayscale {
                filter: grayscale(1);
            }

            &.negative {
                filter: invert();
            }

            &.blur {
                filter: blur(5px);
            }

            &.brightness {
                filter: brightness(4);
            }

            &.contrast {
                filter: contrast(200%);
            }

            &.saturate {
                filter: saturate(300%);
            }

            &.hue-rotate {
                filter: hue-rotate(180deg);
            }

            &.opacity {
                filter: opacity(40%);
            }

            &.drop-shadow {
                filter: drop-shadow(0 0 12px #fff);
            }

            &.combined {
                filter: contrast(150%) saturate(200%) hue-rotate(90deg) drop-shadow(0 0 10px #ff0);
            }

            /* Va al final para que gane sobre los filtros de arriba */
            &:hover {
                filter: none;
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>31-filters</h1>
            <h4>Property (filter) applies graphical transformations (e.g., blur(), grayscale(), contrast(), drop-shadow()) to elements before display.</h4>
        </header>

        <section>
        <section>
            <h4>GrayScale</h4>
            <img class="filter grayscale" src="imgs/cyndaquil2.png" alt="Cyndaquil">
            <h4>Blur</h4>
            <img class="filter blur" src="imgs/cyndaquil2.png" alt="Cyndaquil">
            <h4>Sepia</h4>
            <img class="filter sepia" src="imgs/cyndaquil2.png" alt="Cyndaquil">
            <h4>Brightness</h4>
            <img class="filter brightness" src="imgs/cyndaquil2.png" alt="Cyndaquil">
            <h4>Invert</h4>
            <img class="filter negative" src="imgs/cyndaquil2.png" alt="Cyndaquil">
            <h4>Drop Shadow</h4>
            <img class="filter drop-shadow" src="imgs/cyndaquil2.png" alt="Cyndaquil">
            <h4>HUE Rotate</h4>
            <img class="filter hue-rotate" src="imgs/cyndaquil2.png" alt="Cyndaquil">
        </section>
        </section>
